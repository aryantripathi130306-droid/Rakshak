name: Rakshak v3.0 Release Gate & Operational Hardening Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate-release-gates:
    name: Validate Release Gates & Operational Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Setup Node.js Runtime (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 2. Checkout Repository
        uses: actions/checkout@v4

      - name: 3. Install from Committed Lockfile
        run: npm ci

      - name: 4. Confirm Prisma Engines Present
        run: npx prisma -v

      - name: 5. Generate Configured Prisma Clients (SQLite & PostgreSQL)
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.postgresql.prisma

      - name: 6. Verify Generated PostgreSQL Client Output
        run: |
          test -f node_modules/@prisma/client-pg/index.d.ts
          test -f node_modules/@prisma/client-pg/index.js
          test -f node_modules/@prisma/client-pg/package.json
          echo "Verified @prisma/client-pg output artifacts exist."

      - name: 7. TypeScript Static Compilation
        run: npx tsc --noEmit

      - name: 8. Frontend Import Validation
        run: node scripts/check_frontend_imports.mjs

      - name: 9. Relevant Regression and Security Tests
        run: |
          npm audit --audit-level=high
          node scripts/test_phase17_verifier.mjs
          node scripts/check_frontend_integrity.mjs

      - name: 10. Verify Production Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 11. Release Gate Checks Safe in CI
        run: |
          node scripts/rehearse_postgres_migration_phase18.mjs
          node scripts/validate_disaster_recovery_phase18.mjs
