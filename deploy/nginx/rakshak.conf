# ─────────────────────────────────────────────────────────────────────────────
# deploy/nginx/rakshak.conf
# Rakshak v3.0 — Hardened Reverse Proxy & TLS Configuration
# ─────────────────────────────────────────────────────────────────────────────

upstream rakshak_backend {
    server rakshak-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Plaintext HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name rakshak.law-enforcement.internal localhost 127.0.0.1;

    # Allow local health check over HTTP for proxy health probes
    location = /api/health {
        proxy_pass http://rakshak_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rakshak.law-enforcement.internal localhost 127.0.0.1;

    # TLS Certificate & Key (Mount points)
    ssl_certificate /etc/nginx/certs/rakshak.crt;
    ssl_certificate_key /etc/nginx/certs/rakshak.key;

    # Cryptographic Protocols & Ciphers (TLS 1.2 & TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:;" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Request Body Size Limit (Supports forensic exhibit uploads up to 100MB)
    client_max_body_size 100M;
    client_body_buffer_size 16M;

    # Proxy Timeouts (Supports long-running OCR extraction & ZIP export)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Prohibit direct access to hidden files or source version control
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate-limited API endpoint routing
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://rakshak_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }

    # Reverse Proxy Passage to Next.js Application Service
    location / {
        proxy_pass http://rakshak_backend;
        proxy_http_version 1.1;

        # Connection Header for WebSocket & HTTP keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Disable buffering for live streaming responses
        proxy_buffering off;
    }
}
