# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.preprod.yml
# Rakshak v3.0 — Pre-Production Staging & Cutover Rehearsal Stack
# Strictly bound to loopback; internal PostgreSQL 16; zero public exposure
# ─────────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  rakshak-postgres:
    image: postgres:16-alpine
    container_name: rakshak-preprod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rakshak_preprod
      POSTGRES_USER: rakshak_app_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - preprod-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rakshak-preprod-net
    # Database is strictly accessible only on the internal container network
    # Never expose port 5432 to host or external interfaces
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakshak_app_user -d rakshak_preprod"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - db_password

  rakshak-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rakshak-preprod-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ORIGIN: https://127.0.0.1
      DATABASE_URL: postgresql://rakshak_app_user:${DB_PASSWORD_RAW}@rakshak-postgres:5432/rakshak_preprod?schema=public&sslmode=prefer
      PG_DATABASE_URL: postgresql://rakshak_app_user:${DB_PASSWORD_RAW}@rakshak-postgres:5432/rakshak_preprod?schema=public&sslmode=prefer
      REQUIRE_POSTGRES: "true"
      STRICT_AUTH: "true"
      SESSION_TTL_HOURS: 12
      EVIDENCE_STORAGE_PATH: /app/uploads/raw
      MAX_UPLOAD_SIZE_MB: 100
      TRUST_PROXY: "true"
      REAL_INGESTION_ENABLED: "false"
    volumes:
      - preprod-evidence-storage:/app/uploads/raw
      - preprod-backup-storage:/app/backups
    networks:
      - rakshak-preprod-net
    expose:
      - "3000"
    depends_on:
      rakshak-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  rakshak-proxy:
    image: nginx:1.27-alpine
    container_name: rakshak-preprod-proxy
    restart: unless-stopped
    ports:
      # Bound strictly to loopback interface for local rehearsal only
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/rakshak.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - rakshak-preprod-net
    depends_on:
      - rakshak-app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  rakshak-preprod-net:
    driver: bridge

volumes:
  preprod-postgres-data:
    name: rakshak-preprod-postgres-data
  preprod-evidence-storage:
    name: rakshak-preprod-evidence-storage
  preprod-backup-storage:
    name: rakshak-preprod-backup-storage

secrets:
  db_password:
    file: ./deploy/secrets/db_password.txt
