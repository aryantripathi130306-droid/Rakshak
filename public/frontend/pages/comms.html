<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rakshak — Communication Intelligence. Call transcriptions and chat translations." />
  <title>Comm Intel — Rakshak v3.0</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>
  <div id="toast-container" aria-live="polite"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-shell">
    <header class="app-header" role="banner"></header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar" aria-label="Investigation navigation"></aside>

      <main class="app-main" role="main" aria-label="Communication Intelligence">

        <!-- Tab Bar -->
        <div class="tab-bar" role="tablist" aria-label="Communication types">
          <button class="tab-btn active" role="tab" data-comm-tab="transcripts" aria-selected="true">
            <span aria-hidden="true">📞</span>
            <span>Call Transcriptions</span>
          </button>
          <button class="tab-btn" role="tab" data-comm-tab="chats" aria-selected="false">
            <span aria-hidden="true">💬</span>
            <span>Chat Translations</span>
          </button>
          <div style="flex:1"></div>
          <div style="display:flex;align-items:center;padding:0 14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted)" id="header-time"></div>
        </div>

        <!-- Communications Content -->
        <div class="tab-content">
          <div class="tab-pane active no-pad">
            <div class="comm-layout">

              <!-- Left: List Panel -->
              <div class="comm-list-panel">

                <!-- Transcripts Pane -->
                <div data-comm-pane="transcripts">
                  <div style="padding:8px 10px;border-bottom:1px solid var(--border-subtle);font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:0.07em">
                    CALL RECORDINGS
                  </div>
                  <div id="transcript-list" style="padding:8px;display:flex;flex-direction:column;gap:8px">
                    <div class="loading-row"><span class="spinner" aria-hidden="true"></span> Loading…</div>
                  </div>
                </div>

                <!-- Chats Pane (hidden by default) -->
                <div data-comm-pane="chats" style="display:none">
                  <div style="padding:8px 10px;border-bottom:1px solid var(--border-subtle);font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:0.07em">
                    CHAT EXPORTS
                  </div>
                  <div id="chat-list" style="padding:8px;display:flex;flex-direction:column;gap:8px">
                    <div class="loading-row"><span class="spinner" aria-hidden="true"></span> Loading…</div>
                  </div>
                </div>

                <!-- BSA Notice -->
                <div style="margin:8px;padding:8px 10px;background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.25);border-radius:var(--radius-md);font-size:9px;color:#34d399;line-height:1.5;flex-shrink:0">
                  ✓ Original audio/text preserved under BSA §63. Machine translations supplementary only.
                </div>
              </div>

              <!-- Right: Detail Panel -->
              <div class="comm-detail-panel" role="region" aria-label="Communication detail">
                <div id="comm-detail" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
                  <div class="loading-row">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>Loading communications…</span>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    function updateClock() {
      const el = document.getElementById('header-time');
      if (el) el.textContent = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) + ' IST';
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
  <script type="module" src="../js/comms.js"></script>
</body>
</html>
